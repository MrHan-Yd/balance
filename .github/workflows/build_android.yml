name: Build Android APK

# 触发方式：push 到 master 自动构建；或 Actions 页手动 "Run workflow"
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.3
          cache: true

      # whisper_ggml 需要 NDK 29，Gradle 自动安装前必须先接受许可证
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      # 说明：APK 约 200MB（内置 Whisper 模型 + ffmpeg 原生库），超过 GitHub 100MB
      # 单文件限制，无法回写提交到仓库；统一经 Releases 页附件分发（上限 2GB）。
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^version:' app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          TAG="v${VER}"
          APK="app/build/app/outputs/flutter-apk/app-release.apk"
          echo "版本：${VER}，标签：${TAG}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            gh release upload "${TAG}" "${APK}" --clobber
          else
            gh release create "${TAG}" "${APK}" \
              --title "balance v${VER}" \
              --notes "Android APK（GitHub Actions 自动构建）" \
            || gh release upload "${TAG}" "${APK}" --clobber
          fi
